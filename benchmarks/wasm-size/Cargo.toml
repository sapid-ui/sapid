[package]
name = "sapid-wasm-size"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
base = ["dep:glory", "glory/web"]
sapid-base = ["base", "dep:sapid"]
button = ["sapid-base"]
charts = ["sapid-base", "sapid/charts"]
code = ["sapid-base", "sapid/code"]
files = ["sapid-base", "sapid/files"]
editor = ["sapid-base", "sapid/editor"]
json = ["sapid-base", "sapid/json"]
dates = ["sapid-base", "sapid/dates"]
all-unused = ["charts", "code", "files", "editor", "json", "dates"]
use-charts = ["charts"]
use-code = ["code"]
use-files = ["files"]
use-editor = ["editor"]
use-json = ["json"]
use-dates = ["dates"]

[dependencies]
glory = { path = "../../../glory/crates/glory", default-features = false, optional = true }
sapid = { path = "../..", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
web-sys = { version = "=0.3.107", features = ["Window", "Document", "Element"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false
strip = "debuginfo"
