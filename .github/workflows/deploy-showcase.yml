name: Showcase acceptance
on:
  schedule:
    - cron: '43 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Showcase acceptance coverage
        type: choice
        options: [full, quick]
        default: full
  workflow_call:
    inputs:
      source_ref:
        description: Immutable product commit (PR merge commit for pull requests)
        type: string
        default: ''
      mode:
        type: string
        default: full
      check_rust:
        description: Run showcase Rust tests and Clippy (always true for schedules and releases)
        type: boolean
        default: true
    outputs:
      dist_artifact:
        description: Release assets accepted in this run
        value: ${{ jobs.validate.outputs.dist_artifact }}
      audit_artifact:
        description: Exact dependency audit artifact for the accepted site
        value: ${{ jobs.validate.outputs.audit_artifact }}
      audit_digest:
        description: Successful dependency audit provenance for the accepted site
        value: ${{ jobs.validate.outputs.audit_digest }}
permissions:
  contents: read
concurrency:
  group: sapid-showcase-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_ref || 'branch' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  BUILD_ROOT: ${{ github.workspace }}/sapid/target/verification/sapid/pages-ci
  SAPID_BUILD_ROOT: ${{ github.workspace }}/sapid/target/verification/sapid/pages-ci
  CARGO_TARGET_DIR: ${{ github.workspace }}/sapid/target
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/sapid/target/verification/sapid/pages-ci/browsers
  WRANGLER_SEND_METRICS: 'false'
  PYTHONUTF8: '1'
jobs:
  validate:
    outputs:
      dist_artifact: sapid-showcase-dist-${{ github.run_attempt }}
      audit_digest: ${{ steps.audit.outputs.digest }}
      audit_artifact: sapid-showcase-dependency-audit-${{ github.run_attempt }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: sapid
    steps:
      - name: Preserve repository line endings
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sapid
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Check out coordinated development engines
        shell: bash
        run: |
          if [ ! -d ../apace/.git ]; then git clone --depth 1 https://github.com/glory-rs/apace ../apace; fi
          if [ ! -d ../takia/.git ]; then git clone --depth 1 https://github.com/glory-rs/takia ../takia; fi
          if [ ! -d ../wingy/.git ]; then git clone --depth 1 https://github.com/glory-rs/wingy ../wingy; fi
      - name: Read Glory revision
        id: dependency
        run: |
          $dependency = (Get-Content deploy/dependencies.json -Raw | ConvertFrom-Json).glory
          if ($dependency.revision -notmatch '^[a-f0-9]{40}$') { throw 'Invalid Glory revision' }
          "repository=$($dependency.repository)" >> $env:GITHUB_OUTPUT
          "revision=$($dependency.revision)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.dependency.outputs.repository }}
          ref: ${{ steps.dependency.outputs.revision }}
          path: glory
          persist-credentials: false
      - name: Prepare D drive
        run: |
          New-Item -ItemType Directory -Force $env:BUILD_ROOT,$env:CARGO_TARGET_DIR,$env:TEMP,${{ github.workspace }}/sapid/target/verification/sapid/tmp | Out-Null
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default 1.98.0
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      # Cache helpers follow the workflow revision, including validation of an older release tag.
      - name: Check out workflow-versioned CI support
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ci-support
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./ci-support/.github/actions/build-cache
        with:
          scope: showcase
          tools-root: ${{ env.BUILD_ROOT }}
      - name: Install verified build and deployment tools without credentials
        run: |
          $tools = ./scripts/install-build-tools.ps1 -BuildRoot $env:BUILD_ROOT
          "SAPID_BINDGEN=$($tools.Bindgen)" >> $env:GITHUB_ENV
          "SAPID_PLAYWRIGHT=$($tools.Playwright)" >> $env:GITHUB_ENV
          "SAPID_TOOLS_RECEIPT_SHA256=$($tools.ReceiptSha256)" >> $env:GITHUB_ENV
          node (Join-Path $tools.Playwright 'cli.js') install chromium
          if ($LASTEXITCODE) { throw 'Chromium installation failed' }
      - name: Test tool integrity rejection paths
        run: python -m unittest discover -s scripts -p test_tools.py
      - name: Verify immutable assets and release retention
        run: python scripts/test-site-assets.py

      - name: Validate and build production showcase
        env:
          CHECK_RUST: ${{ inputs.check_rust != false || inputs.source_ref == '' }}
        run: |
          ./scripts/install-build-tools.ps1 -BuildRoot $env:BUILD_ROOT -VerifyOnly | Out-Null
          $arguments = @{ Release=$true; BuildRoot=$env:BUILD_ROOT; Bindgen=$env:SAPID_BINDGEN }
          if ($env:CHECK_RUST -eq 'false') { $arguments.StylesOnly = $true }
          ./scripts/check-showcase.ps1 @arguments
      - name: Browser acceptance of actual release assets
        env:
          ACCEPTANCE_MODE: ${{ inputs.mode || 'full' }}
        run: |
          ./scripts/install-build-tools.ps1 -BuildRoot $env:BUILD_ROOT -VerifyOnly | Out-Null
          node ../ci-support/scripts/showcase-acceptance.cjs --root . --directory "$env:BUILD_ROOT/showcase" --output "$env:BUILD_ROOT/acceptance" --mode $env:ACCEPTANCE_MODE --jobs=2
          if ($LASTEXITCODE) { throw 'Showcase acceptance failed' }
      - name: Audit the exact showcase dependency resolution
        id: audit
        uses: ./ci-support/.github/actions/dependency-audit
        with:
          output: ${{ env.BUILD_ROOT }}/dependency-audit
          subject: ${{ env.BUILD_ROOT }}/showcase/asset-hashes.json
      - name: Bind dependency audit to the accepted site
        run: |
          python ../ci-support/scripts/audit_evidence.py verify --root . --directory "$env:BUILD_ROOT/dependency-audit" --expected-commit (git rev-parse HEAD) --subject "$env:BUILD_ROOT/showcase/asset-hashes.json" --current-locks --current-sources --require-package --export "$env:BUILD_ROOT/dependency-audit-export"
          if ($LASTEXITCODE) { throw 'Showcase audit export failed' }
      - name: Preserve accepted dependency audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sapid-showcase-dependency-audit-${{ github.run_attempt }}
          path: ${{ env.BUILD_ROOT }}/dependency-audit-export
          if-no-files-found: error
          retention-days: 7
      - name: Preserve accepted release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sapid-showcase-dist-${{ github.run_attempt }}
          path: ${{ env.BUILD_ROOT }}/showcase
          if-no-files-found: error
          retention-days: 7
      - name: Preserve acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sapid-showcase-acceptance-${{ github.run_attempt }}
          path: ${{ env.BUILD_ROOT }}/acceptance
          if-no-files-found: warn
          retention-days: 14
      - name: Trim disposable Cargo cache binaries
        run: '& ../ci-support/scripts/ci-cache-paths.ps1 -ProjectRoot $PWD.Path -OutputFile "" -Prune'
