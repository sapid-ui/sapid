name: Sapid CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_ref:
        description: Immutable source ref to validate
        required: false
        type: string
      acceptance_ref:
        description: Immutable browser acceptance harness revision
        required: false
        type: string
    outputs:
      acceptance_artifact:
        description: Exact successful acceptance artifact for this product and harness
        value: ${{ jobs.widgets.outputs.acceptance_artifact }}
      acceptance_provenance_sha256:
        description: Digest of the successful acceptance provenance
        value: ${{ jobs.widgets.outputs.acceptance_provenance_sha256 }}
permissions:
  contents: read
  actions: read
concurrency:
  group: sapid-ci-${{ github.ref }}-${{ inputs.release_ref || 'branch' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    uses: ./.github/workflows/change-scope.yml
    with:
      release_ref: ${{ inputs.release_ref }}
  documentation:
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_ref || github.sha }}
          path: sapid
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: ci-support
          persist-credentials: false
          sparse-checkout: scripts/check_doc_links.py
          sparse-checkout-cone-mode: false
      - name: Check documentation and generated ledgers without compiling Rust
        env:
          DOC_BASE: ${{ inputs.release_ref == '' && needs.scope.outputs.base || '' }}
        run: |
          python3 ci-support/scripts/check_doc_links.py --root sapid --base "$DOC_BASE"
          cd sapid
          python3 scripts/widget-plan.py --check
          python3 scripts/capability-gallery.py --check
  showcase:
    needs: scope
    if: needs.scope.outputs.showcase == 'true'
    uses: ./.github/workflows/deploy-showcase.yml
    with:
      source_ref: ${{ inputs.release_ref || github.sha }}
      mode: ${{ inputs.release_ref != '' && 'full' || 'quick' }}
      check_rust: ${{ needs.scope.outputs.showcase_rust == 'true' }}
  widgets:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      acceptance_artifact: ${{ steps.provenance.outputs.artifact_name }}
      acceptance_provenance_sha256: ${{ steps.provenance.outputs.provenance_sha256 }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/sapid/target
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/sapid/target/verification/sapid/browsers
      SAPID_BUILD_ROOT: ${{ github.workspace }}/sapid/target/verification/sapid
      SAPID_BROWSER_OUTPUT: ${{ github.workspace }}/sapid/target/verification/sapid
      SAPID_BROWSER_RUNNER: ${{ inputs.acceptance_ref && '../acceptance/scripts/browser.cjs' || 'scripts/browser.cjs' }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.symlinks
      GIT_CONFIG_VALUE_0: 'true'
    defaults:
      run:
        shell: pwsh
        working-directory: sapid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: sapid
          ref: ${{ inputs.release_ref || github.sha }}
      - name: Check out coordinated engines
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          if [ ! -d ../apace/.git ]; then
            if [ -n "$RELEASE_REF" ]; then
              git clone --depth 1 --branch apace-v0.3.0 https://github.com/glory-rs/apace ../apace
            else
              git clone --depth 1 https://github.com/glory-rs/apace ../apace
            fi
          fi
          if [ ! -d ../takia/.git ]; then
            if [ -n "$RELEASE_REF" ]; then
              git clone --depth 1 --branch takia-v0.15.1 https://github.com/glory-rs/takia ../takia
            else
              git clone --depth 1 https://github.com/glory-rs/takia ../takia
            fi
          fi
          if [ ! -d ../wingy/.git ]; then
            if [ -n "$RELEASE_REF" ]; then
              git clone --depth 1 --branch wingy-v0.31.1 https://github.com/glory-rs/wingy ../wingy
            else
              git clone --depth 1 https://github.com/glory-rs/wingy ../wingy
            fi
          fi
      - name: Read the pinned Glory release source
        id: dependency
        env:
          EXPECTED_PRODUCT: ${{ inputs.release_ref }}
          EXPECTED_ACCEPTANCE: ${{ inputs.acceptance_ref }}
        run: |
          if ($env:EXPECTED_PRODUCT -and $env:EXPECTED_PRODUCT -notmatch '^[a-f0-9]{40}$') { throw 'Release validation requires an immutable commit SHA' }
          if ($env:EXPECTED_ACCEPTANCE -and $env:EXPECTED_ACCEPTANCE -notmatch '^[a-f0-9]{40}$') { throw 'Acceptance requires an immutable commit SHA' }
          $product = git rev-parse HEAD
          if ($LASTEXITCODE -or ($env:EXPECTED_PRODUCT -and $product -ne $env:EXPECTED_PRODUCT)) { throw 'Product checkout differs from the frozen release commit' }
          $dependency = (Get-Content deploy/dependencies.json -Raw | ConvertFrom-Json).glory
          if ($dependency.revision -notmatch '^[a-f0-9]{40}$') { throw 'Invalid Glory source revision' }
          "repository=$($dependency.repository)" >> $env:GITHUB_OUTPUT
          "revision=$($dependency.revision)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.dependency.outputs.repository }}
          ref: ${{ steps.dependency.outputs.revision }}
          path: glory
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Prepare compiler
        run: |
          New-Item -ItemType Directory -Force $env:CARGO_TARGET_DIR,$env:TEMP | Out-Null
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          if ($LASTEXITCODE) { throw 'Compiler installation failed' }
          rustup default 1.98.0
      # Cache helpers follow the workflow revision, including validation of an older release tag.
      - name: Check out workflow-versioned CI support
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ci-support
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./ci-support/.github/actions/build-cache
        with:
          scope: widgets
          tools-root: ${{ env.SAPID_BUILD_ROOT }}
      - name: Install verified prebuilt WASM and browser tools
        run: |
          $tools = ./scripts/install-build-tools.ps1 -BuildRoot $env:SAPID_BUILD_ROOT
          "SAPID_BINDGEN=$($tools.Bindgen)" >> $env:GITHUB_ENV
          "SAPID_PLAYWRIGHT=$($tools.Playwright)" >> $env:GITHUB_ENV
          "SAPID_TOOLS_RECEIPT_SHA256=$($tools.ReceiptSha256)" >> $env:GITHUB_ENV
          node (Join-Path $tools.Playwright 'cli.js') install chromium
          if ($LASTEXITCODE) { throw 'Chromium installation failed' }
      - name: Validate release, inventory and showcase sources
        run: |
          & ../ci-support/scripts/test-ci-cache.ps1 -ProjectRoot $PWD.Path
          python -m unittest discover -s scripts -p test_release.py
          if ($LASTEXITCODE) { throw 'Release tooling tests failed' }
          python scripts/widget-plan.py --check
          if ($LASTEXITCODE) { throw 'Widget inventory failed' }
          python scripts/capability-gallery.py --check
          if ($LASTEXITCODE) { throw 'Capability evidence or generated gallery failed' }
          python scripts/showcase-catalog.py --check
          if ($LASTEXITCODE) { throw 'Showcase sources failed' }
      - name: Validate publication sources for a frozen release
        if: inputs.release_ref != ''
        run: |
          python scripts/release.py
          if ($LASTEXITCODE) { throw 'Release plan failed' }
          python scripts/release.py --check-package sapid
          if ($LASTEXITCODE) { throw 'Archive contents failed' }
      - name: Widget, SSR, native and browser compilation checks
        run: ./scripts/check.ps1 -Web -Native -Bindgen $env:SAPID_BINDGEN
      - name: Mixed DSL hydration and native acceptance
        run: ./scripts/check-dsl.ps1 -Browser -Native -Bindgen $env:SAPID_BINDGEN
      - name: Check out the independently versioned browser harness
        if: inputs.acceptance_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.acceptance_ref }}
          path: acceptance
          sparse-checkout: |
            .gitattributes
            scripts/browser.cjs
            scripts/showcase-browser-env.cjs
            scripts/release.py
            scripts/library_lock.py
            examples/web
          sparse-checkout-cone-mode: false
      - name: Actual widget browser acceptance
        run: |
          $fixture = Start-Process python -ArgumentList @('-m','http.server','8794','--protocol','HTTP/1.1','--bind','127.0.0.1','--directory','${{ github.workspace }}/sapid/target/verification/sapid/web') -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try { Invoke-WebRequest http://127.0.0.1:8794 -UseBasicParsing | Out-Null; $ready = $true; break }
              catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Browser fixture did not start' }
            node $env:SAPID_BROWSER_RUNNER --jobs=2
            if ($LASTEXITCODE) { throw 'Widget browser acceptance failed' }
          }
          finally { Stop-Process -Id $fixture.Id -ErrorAction SilentlyContinue }
      - name: Record successful acceptance provenance
        if: inputs.release_ref != ''
        id: provenance
        env:
          EXPECTED_PRODUCT: ${{ inputs.release_ref }}
          EXPECTED_ACCEPTANCE: ${{ inputs.acceptance_ref }}
        run: |
          $harnessRoot = if (Test-Path ../acceptance/.git) { '../acceptance' } else { '.' }
          $arguments = @('--record-acceptance','--product-root','.', '--harness-root',$harnessRoot,'--fixtures-root','${{ github.workspace }}/sapid/target/verification/sapid/web','--provenance','${{ github.workspace }}/sapid/target/verification/sapid/browser-provenance.json')
          if ($env:EXPECTED_PRODUCT) { $arguments += @('--expected-commit',$env:EXPECTED_PRODUCT) }
          if ($env:EXPECTED_ACCEPTANCE) { $arguments += @('--acceptance-commit',$env:EXPECTED_ACCEPTANCE) }
          python (Join-Path $harnessRoot 'scripts/release.py') @arguments
          if ($LASTEXITCODE) { throw 'Browser evidence validation failed' }
          "artifact_name=sapid-browser-acceptance-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
          "provenance_sha256=$((Get-FileHash ${{ github.workspace }}/sapid/target/verification/sapid/browser-provenance.json -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Preserve browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.provenance.outputs.artifact_name || format('sapid-browser-acceptance-failed-{0}', github.run_attempt) }}
          path: |
            ${{ github.workspace }}/sapid/target/verification/sapid/browser-results.json
            ${{ github.workspace }}/sapid/target/verification/sapid/browser-progress.json
            ${{ github.workspace }}/sapid/target/verification/sapid/browser-provenance.json
            ${{ github.workspace }}/sapid/target/verification/sapid/library-Cargo.lock
          if-no-files-found: ignore

      - name: Trim disposable Cargo cache binaries
        run: '& ../ci-support/scripts/ci-cache-paths.ps1 -ProjectRoot $PWD.Path -OutputFile "" -Prune'

  deploy:
    needs: [scope, documentation, widgets, showcase]
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.scope.result == 'success' && needs.showcase.result == 'success' &&
      (needs.widgets.result == 'success' || (needs.scope.outputs.rust == 'false' && needs.widgets.result == 'skipped')) &&
      (needs.documentation.result == 'success' || (needs.scope.outputs.docs == 'false' && needs.documentation.result == 'skipped'))
    runs-on: windows-latest
    timeout-minutes: 15
    concurrency:
      group: sapid-pages-production
      cancel-in-progress: false
    env:
      BUILD_ROOT: ${{ github.workspace }}/sapid/target/verification/sapid/pages-ci
      WRANGLER_SEND_METRICS: 'false'
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: sapid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sapid
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Restore downloaded deployment tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.BUILD_ROOT }}/tools
            ${{ env.BUILD_ROOT }}/npm
          key: sapid-tools-v3-${{ runner.os }}-${{ hashFiles('sapid/deploy/build-tools.json', 'sapid/deploy/tools/package-lock.json') }}
      - name: Install verified deployment tools without credentials
        run: |
          $tools = ./scripts/install-build-tools.ps1 -BuildRoot $env:BUILD_ROOT
          "SAPID_TOOLS_RECEIPT_SHA256=$($tools.ReceiptSha256)" >> $env:GITHUB_ENV
      - name: Download the exact accepted site from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.showcase.outputs.dist_artifact }}
          path: ${{ env.BUILD_ROOT }}/showcase
      - name: Skip a superseded main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          if ($LASTEXITCODE) { throw 'Cannot verify production revision' }
          "deploy=$($head -eq $env:GITHUB_SHA)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - name: Deploy to Cloudflare Pages
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./scripts/deploy-pages.ps1 -Directory "$env:BUILD_ROOT/showcase" -BuildRoot $env:BUILD_ROOT
